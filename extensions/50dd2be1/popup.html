<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 240px; padding: 15px; font-family: 'Segoe UI', sans-serif; background: #f4f4f9; margin: 0; }
    .card { background: white; border-radius: 10px; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h3 { margin: 0 0 10px 0; font-size: 14px; color: #333; text-align: center; }
    
    .switch-container { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-on { background: #4CAF50; color: white; }
    .btn-off { background: #ddd; color: #666; }

    /* Блок рекламы */
    #ad-container {
      border-top: 1px solid #eee;
      padding-top: 10px;
      text-align: center;
      display: none; /* Пока не загрузится конфиг */
    }
    #ad-link { text-decoration: none; color: inherit; display: block; }
    #ad-img { width: 100%; border-radius: 6px; margin-bottom: 5px; }
    #ad-text { font-size: 11px; color: #555; font-weight: 500; line-height: 1.3; }
    .ad-label { font-size: 9px; color: #aaa; text-transform: uppercase; margin-bottom: 4px; display: block; }
  </style>
</head>
<body>
  <h3>Control Panel</h3>
  
  <div class="card">
    <div class="switch-container">
      <span>Anti-Block</span>
      <button id="antiBlockBtn" class="btn-off">OFF</button>
    </div>
    <div class="switch-container">
      <span>Ad-Blocker</span>
      <button id="adBlockBtn" class="btn-off">OFF</button>
    </div>
  </div>

  <div id="ad-container" class="card">
    <span class="ad-label">Реклама</span>
    <a id="ad-link" href="#" target="_blank">
      <img id="ad-img" src="" alt="Promo">
      <div id="ad-text">Загрузка...</div>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
